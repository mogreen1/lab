---
- name: Print AAP Workflow Node Info 
  hosts: localhost
  connection: local
  gather_facts: no
  vars_files: vault.yml
  vars:
    provider:
      ip_address: "{{ palo_ip_address }}"
      username: "{{ palo_username }}"
      password: "{{ palo_password }}"

  tasks:
    - debug:
        var: my_job_id
    
    - name: Get Worfkow Node Results 
      ansible.builtin.uri:
        url: >-
          https://aap.shadowman.dev/api/controller/v2/jobs/{{ my_job_id }}/job_events
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        return_content: true
        validate_certs: false 
      delegate_to: localhost
      #no_log: true
      register: my_job_results
  

    - name: Get Tasks that resulted in a change
      ansible.builtin.set_fact:
        task_result: >-
          {{
            my_job_results.json.results
            | rejectattr('event_data.res', 'undefined')
            | selectattr('event_data.res.changed', 'equalto', true)
            | map(attribute='event_data.res')
          }}
    
    - name: Print Job results
      debug:
        var: task_result 
          #my_job_results.json.results[7].event_data.res.invocation.module_args 
